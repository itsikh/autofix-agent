# autofix-agent configuration for WakeCast
#
# Code, issues, and releases all live in the private GitHub repo
# itsikh/WakeCast. There is no Bitbucket remote.
APP_SLUG="wakecast"
PROJECT_DIR="/Users/itsik-personal/dev/WakeCast"
PROJECT_DIR_CLOUD="${HOME}/dev/WakeCast"
BUGS_REPO="itsikh/WakeCast"

# Collides with the legacy template autofix lock
# /tmp/com-itsikh-wakecast-autofix.lockdir (applicationId with dots->dashes).
LOCK_SLUG="com-itsikh-wakecast"
GIT_REMOTES="auto"
PROMPT_FILE="android-default"
RELEASE_MODE="skill"
BUILD_TASK="assembleDebug"
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=5

# CI (GitHub Actions): where to clone the code from on an ephemeral runner.
CODE_REPO="https://github.com/itsikh/WakeCast.git"

# Signing: standard template layout — keystore.properties at the project
# root with storeFile / storePassword / keyAlias / keyPassword
# (app/build.gradle.kts). storeFile is the relative path ../wakecast.jks
# (sibling of the project). No SIGNING_* keys needed: CI rewrites storeFile
# to the decoded keystore path. See docs/CLOUD.md#signing.
