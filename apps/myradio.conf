# autofix-agent configuration for MyRadio
#
# Issues and releases live in the private GitHub repo itsikh/myradio.
# The canonical remote is origin -> Bitbucket; github is the GitHub mirror.
# worker.sh pushes to every remote returned by `git remote`.
APP_SLUG="myradio"
PROJECT_DIR="/Users/itsik-personal/dev/MyRadio"
PROJECT_DIR_CLOUD="${HOME}/dev/MyRadio"
BUGS_REPO="itsikh/myradio"

# Collides with the legacy template autofix lock
# /tmp/com-itsikh-myradio-autofix.lockdir (applicationId with dots->dashes).
LOCK_SLUG="com-itsikh-myradio"
GIT_REMOTES="auto"
PROMPT_FILE="android-default"
RELEASE_MODE="skill"
BUILD_TASK="assembleDebug"
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=5

# CI (GitHub Actions): where to clone the code from on an ephemeral runner.
# Prefer GitHub for CODE_REPO (APP_REPO_TOKEN, no SSH). Mirror is Bitbucket;
# clone-app.sh adds it as a remote named "bitbucket".
CODE_REPO="https://github.com/itsikh/myradio.git"
CODE_REPO_MIRROR="git@bitbucket.org:itsik_harel/myradio.git"

# Signing: standard template layout — keystore.properties at the project
# root with storeFile / storePassword / keyAlias / keyPassword
# (app/build.gradle.kts). storeFile is the relative path ../myradio.jks
# (sibling of the project). No SIGNING_* keys needed: CI rewrites storeFile
# to the decoded keystore path. See docs/CLOUD.md#signing.
