# autofix-agent configuration for MyLock
APP_SLUG="mylock"
PROJECT_DIR="/Users/itsik-personal/dev/MyLock"
PROJECT_DIR_CLOUD="${HOME}/dev/MyLock"
BUGS_REPO="itsikh/mylock"

LOCK_SLUG="com-mylock-app"
