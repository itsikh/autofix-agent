# autofix-agent configuration for finnencer
#
# finnencer uses the same GitHub repo (itsikh/finnencer) for both issues and
# releases — there is no separate `-releases` repo. The canonical remote is
# Bitbucket (origin) and GitHub is a mirror (github). worker.sh pushes to
# every remote returned by `git remote`; non-fatal push failures (e.g. when
# the cloud VM lacks Bitbucket SSH) are tolerated.
APP_SLUG="finnencer"
PROJECT_DIR="/Users/itsik-personal/dev/finnencer"
PROJECT_DIR_CLOUD="${HOME}/dev/finnencer"
BUGS_REPO="itsikh/finnencer"

LOCK_SLUG="finnencer"
GIT_REMOTES="auto"
PROMPT_FILE="android-default"
RELEASE_MODE="skill"
BUILD_TASK="assembleDebug"
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=5
