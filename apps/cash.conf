# autofix-agent configuration for cash
#
# Code lives only on Bitbucket; issues and GitHub Releases are in
# itsikh/cash-releases. The canonical remote is origin -> Bitbucket.
# cash is not a shared-template app (Hilt application class is
# CashApplication, no AppConfig.kt), but it is Kotlin/Compose/Hilt,
# minSdk 26, targetSdk 35, so android-default still fits.
APP_SLUG="cash"
PROJECT_DIR="/Users/itsik-personal/dev/cash"
PROJECT_DIR_CLOUD="${HOME}/dev/cash"
BUGS_REPO="itsikh/cash-releases"

# Collides with the legacy per-app script's /tmp/cash-autofix.lockdir
# so the two cannot run at once.
LOCK_SLUG="cash"
GIT_REMOTES="auto"
PROMPT_FILE="android-default"
RELEASE_MODE="skill"
BUILD_TASK="assembleDebug"
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=5

# CI (GitHub Actions): where to clone the code from on an ephemeral runner.
# Bitbucket-only, like mychef / sosblocker / calcvault. Needs BITBUCKET_SSH_KEY.
CODE_REPO="git@bitbucket.org:itsik_harel/cash.git"

# Signing: credentials live in local.properties as RELEASE_STORE_FILE /
# RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD, and the
# keystore sits at the project root as cash-release.jks (app/build.gradle.kts
# reads them via local.properties, defaulting RELEASE_STORE_FILE to
# cash-release.jks). See docs/CLOUD.md#signing.
SIGNING_PROPS_FILE="local.properties"
KEYSTORE_PATH_KEY="RELEASE_STORE_FILE"
KEYSTORE_DEST="{DEST}/cash-release.jks"
