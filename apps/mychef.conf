# autofix-agent configuration for MyChef
APP_SLUG="mychef"
PROJECT_DIR="/Users/itsik-personal/dev/mychef"
PROJECT_DIR_CLOUD="${HOME}/dev/mychef"
BUGS_REPO="itsikh/mychef-releases"

LOCK_SLUG="mychef"
GIT_REMOTES="auto"
PROMPT_FILE="android-default"
RELEASE_MODE="skill"
BUILD_TASK="assembleDebug"
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=13

# CI (GitHub Actions): where to clone the code from on an ephemeral runner.
CODE_REPO="git@bitbucket.org:itsik_harel/mychef.git"

# Signing: credentials live in local.properties as RELEASE_STORE_FILE /
# RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD, and the
# keystore sits at the project root as mychef-release.jks (app/build.gradle.kts
# reads them via localProps). Verified against the published APK: keystore and
# signer both SHA-256 56b3..8d33. See docs/CLOUD.md#signing.
SIGNING_PROPS_FILE="local.properties"
KEYSTORE_PATH_KEY="RELEASE_STORE_FILE"
KEYSTORE_DEST="{DEST}/mychef-release.jks"
