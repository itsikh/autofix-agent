# autofix-agent configuration for TriviaApp
#
# This app predates the shared template and disagrees with it on almost every
# assumption the agent used to hardcode. It was registered, then disabled as
# broken; each of the reasons turned out to be a wrong assumption here rather
# than a missing piece in the app:
#
#   * BUGS_REPO pointed at github.com/itsikh/triviaapp, which does not exist, so
#     every issue lookup failed silently. The app has always filed its reports to
#     itsikh/trivia-releases — see admin/BugReportManager.kt, GITHUB_REPO.
#   * The label is `auto-fix`, not `autofix`. BugReportManager's FixMode enum
#     writes AUTO_FIX("auto-fix") for "Claude fixes automatically" and
#     NEEDS_REVIEW("needs-review") for "propose a plan first" — so only auto-fix
#     may be picked up, and renaming it in the app would strand every ticket
#     filed by an already-installed copy.
#   * Its default branch is `main-clean`, and worker.sh refused any branch but
#     `main`. Now MAIN_BRANCH.
#   * It is Views + XML, no Compose, no Hilt, Hebrew/RTL, minSdk 24 — the default
#     prompt asserts the opposite of all four. Hence its own prompt file.
ENABLED="true"

APP_SLUG="triviaapp"
PROJECT_DIR="/Users/itsik-personal/dev/triviaapp"
PROJECT_DIR_CLOUD="${HOME}/dev/triviaapp"

# Issues AND releases live here. The code is on Bitbucket; this GitHub repo is
# the bug tracker the in-app reporter writes to.
BUGS_REPO="itsikh/trivia-releases"

LOCK_SLUG="triviaapp"
GIT_REMOTES="auto"
MAIN_BRANCH="main-clean"
AUTOFIX_LABEL="auto-fix"
PROMPT_FILE="triviaapp"
RELEASE_MODE="skill"
BUILD_TASK="assembleDebug"
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=20

# Deliberately NO CODE_REPO: this app is Mac-only and not eligible for CI.
#
# Not for size — that was the earlier assumption and it was wrong. The remote is
# small (largest blob 1.6 MB); the 1.7 GB local .git came from one unpushed
# Gen1 auto-commit that had force-added a 3.6 GB emulator system image. That
# commit is dropped and .git is now 11 MB, so a CI clone would be cheap.
#
# The real blocker is its release procedure. .claude/commands/release.md needs
# RELEASE_DIR — a sibling ${PROJECT_DIR}_release clone of trivia-releases — where
# it writes latest.json, the manifest the in-app updater reads. A CI runner has
# no such clone, so a cloud run could fix and close an issue and then be unable
# to release it, which is the exact gap ci/release-drift.sh exists to prevent.
#
# Fixing and releasing both happen on the Mac, where that clone lives and works.
# To make this CI-eligible, teach release.md to create/clone RELEASE_DIR itself
# (or publish latest.json via the API instead of a checkout); everything else is
# already portable — google-services.json and app/release-keystore.jks are both
# tracked, so a runner needs no signing secret for this app.
