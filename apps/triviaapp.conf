# autofix-agent configuration for TriviaApp
#
# DISABLED: BUGS_REPO below points at github.com/itsikh/triviaapp, which does not
# exist, so every issue lookup for this app fails silently. The code lives on
# Bitbucket (git@bitbucket.org:itsik_harel/triviaapp.git) but there is no GitHub
# repo hosting its issues. Create one and set BUGS_REPO + CODE_REPO to re-enable.
ENABLED="false"

APP_SLUG="triviaapp"
PROJECT_DIR="/Users/itsik-personal/dev/triviaapp"
PROJECT_DIR_CLOUD="${HOME}/dev/triviaapp"
BUGS_REPO="itsikh/triviaapp"

LOCK_SLUG="triviaapp"
GIT_REMOTES="auto"
PROMPT_FILE="android-default"
RELEASE_MODE="skill"
BUILD_TASK="assembleDebug"
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=20
