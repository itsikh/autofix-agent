# autofix-agent configuration for the CalcVault desktop (Chrome extension + native agent)
#
# Different from every other app here:
#   * Only issues whose `approved` label was added by APPROVED_BY after the issue was
#     filed — and whose title/body were not edited after that — are worked on
#     (worker.sh filter_approved). Until then nothing runs, not even the pre-run
#     auto-commit/push.
#   * LIMIT: GitHub only records WHO added a label. The extension's "Report a bug"
#     files issues with a token of this same account, so whoever holds that token
#     could also add `approved`. The gate protects against other accounts, labels
#     set while filing, and edits after approval; to make it a true human gate the
#     reporter needs its own identity (machine user or GitHub App).
#   * The fix session gets no `gh`/push/web tools; protected files (manifest,
#     dependency and build files, CI) fail the attempt instead of being committed.
#   * No Gradle: BUILD_CMD typechecks, unit-tests and builds the TypeScript extension
#     and tests the Go agent. Releases are made by hand (docs/RELEASE.md in the app
#     repo), so RELEASE_MODE=manual.
APP_SLUG="calcvaultdesktop"
PROJECT_DIR="/Users/itsik-personal/dev/calc-vault-desktop"
PROJECT_DIR_CLOUD="${HOME}/dev/calc-vault-desktop"
BUGS_REPO="itsikh/calc-vault-desktop"

LOCK_SLUG="calcvaultdesktop"
GIT_REMOTES="auto"
AUTOFIX_LABEL="approved"
APPROVED_BY="itsikh"
PROMPT_FILE="web-extension"
RELEASE_MODE="manual"
BUILD_ENV_CHECK_CMD="node -v && npm -v && go version"
BUILD_CMD="(cd crypto-ts && npm ci --ignore-scripts --no-audit --no-fund) && cd extension && npm ci --ignore-scripts --no-audit --no-fund && npm run typecheck && npm test && npm run build && cd ../agent && go vet ./... && go test ./..."
PROTECTED_PATHS="extension/static/manifest.json extension/package.json extension/package-lock.json extension/scripts crypto-ts/package.json agent/go.mod agent/go.sum agent/build.sh agent/install .github"
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=10
# Mac only: no CODE_REPO (not CI-eligible), and the VM's clone is a dev checkout.
CLOUD_SKIP="true"
