# autofix-agent configuration for the CalcVault desktop (Chrome extension + native agent)
#
# Different from every other app here in two ways:
#   * Issues come from the extension's "Report a bug" button, which files them with
#     a user's issues-write token. Anyone holding such a token can also add labels,
#     so a label alone is not consent. Only issues whose `approved` label was added
#     by APPROVED_BY — and not edited after — are worked on (see filter_approved).
#   * No Gradle: BUILD_CMD runs typecheck + unit tests + build of the TypeScript
#     extension and the Go agent's tests. Releases are made by hand
#     (docs/RELEASE.md in the app repo), so RELEASE_MODE=manual.
APP_SLUG="calcvaultdesktop"
PROJECT_DIR="/Users/itsik-personal/dev/calc-vault-desktop"
PROJECT_DIR_CLOUD="${HOME}/dev/calc-vault-desktop"
BUGS_REPO="itsikh/calc-vault-desktop"

LOCK_SLUG="calcvaultdesktop"
GIT_REMOTES="auto"
AUTOFIX_LABEL="approved"
APPROVED_BY="itsikh"
PROMPT_FILE="web-extension"
RELEASE_MODE="manual"
BUILD_CMD="cd extension && npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build && cd ../agent && go vet ./... && go test ./..."
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=10
# Deliberately NO CODE_REPO: Mac/VM only, not CI-eligible yet.
