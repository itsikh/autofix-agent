# autofix-agent configuration for Anova
APP_SLUG="anova"
PROJECT_DIR="/Users/itsik-personal/dev/Anova"
PROJECT_DIR_CLOUD="${HOME}/dev/Anova"
BUGS_REPO="itsikh/Anova"

LOCK_SLUG="anova"
GIT_REMOTES="auto"
PROMPT_FILE="android-default"
RELEASE_MODE="skill"
BUILD_TASK="assembleDebug"
MAX_RETRIES=3
CLAUDE_PROMPT_MODE="arg"
CRON_INTERVAL=4

# CI (GitHub Actions): where to clone the code from on an ephemeral runner.
CODE_REPO="https://github.com/itsikh/Anova.git"
CODE_REPO_MIRROR="git@bitbucket.org:itsik_harel/anova.git"

# Signing: this app's `release` buildType is signed with the DEBUG keystore
# (app/build.gradle.kts: signingConfig = signingConfigs.getByName("debug")), read
# from ~/.android/debug.keystore. Its published APKs really are debug-signed —
# verified against Anova-v0.0.40.apk, signer SHA-256 1061..4e28, which matches the
# debug keystore on the Mac. CI must therefore install that exact file: a freshly
# generated debug keystore has a different key, and every installed copy of Anova
# would lose its update path. See docs/CLOUD.md#signing.
KEYSTORE_DEST="{HOME}/.android/debug.keystore"
