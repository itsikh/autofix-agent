# Cloud override for ~/.gradle/gradle.properties on the GCE e2-micro instance.
#
# User-home gradle.properties takes HIGHER precedence than project-level
# gradle.properties, so these settings win without touching any project repo.
# This keeps Mac projects with their high-performance settings untouched.
#
# Install: cp cloud/gradle.properties ~/.gradle/gradle.properties
# (setup-cloud.sh does this automatically and fills in org.gradle.java.home)

# ── Java ─────────────────────────────────────────────────────────────────────
# Set by setup-cloud.sh after Java is installed. Overrides the Mac-specific
# /Applications/Android Studio.app/... path that's in each project's file.
# org.gradle.java.home=

# ── JVM tuned for e2-micro (1 GB total RAM) ──────────────────────────────────
# Budget: OS ~250 MB + Gradle JVM ≤700 MB + Claude CLI ~150 MB (sequential).
# Claude exits before Gradle starts, so peak is max(700, 150) = 700 MB.
org.gradle.jvmargs=-Xmx700m -Xms64m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# ── Daemon / parallelism ──────────────────────────────────────────────────────
# No daemon: a persistent JVM wastes ~100-200 MB between builds.
# agent.sh already enforces MAX_PARALLEL=1 on Linux, so no two builds run at
# once — no benefit to parallel compilation within a single build either.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=false

# ── Kotlin compiler ───────────────────────────────────────────────────────────
# in-process: Kotlin compiles inside the Gradle JVM instead of spawning a
# separate daemon JVM (which alone would need 512 MB-4 GB by default).
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# ── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
